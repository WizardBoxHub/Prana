<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathe — Premium Voodoo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #5F6A30;
  color: #FBFFB8;
  font-family: 'Fraunces', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

h1 {
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.5;
  font-weight: 300;
  margin-bottom: 40px;
}

.mode-select {
  display: flex;
  gap: 12px;
  margin-bottom: 36px;
}

.mode-card {
  border: 0.5px solid rgba(251,255,184,0.2);
  border-radius: 12px;
  padding: 18px 16px 14px;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s;
  background: rgba(251,255,184,0.04);
  width: 130px;
}

.mode-card.active {
  border-color: rgba(251,255,184,0.6);
  background: rgba(251,255,184,0.1);
}

.mode-card svg { display: block; margin: 0 auto 10px; overflow: visible; }

.mc-name {
  font-size: 14px;
  color: #FBFFB8;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.mc-desc {
  font-size: 11px;
  color: rgba(251,255,184,0.45);
  line-height: 1.4;
}

.collapsible {
  transition: opacity 0.5s, max-height 0.6s;
  max-height: 120px;
  opacity: 1;
  overflow: hidden;
}
.collapsible.hidden { opacity: 0; max-height: 0; pointer-events: none; }

.sliders {
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: 36px;
}

.ctrl {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.ctrl label {
  font-size: 10px;
  color: rgba(251,255,184,0.4);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.ctrl input[type=range] {
  width: 90px;
  -webkit-appearance: none;
  height: 1px;
  background: rgba(251,255,184,0.25);
  outline: none;
  cursor: pointer;
}

.ctrl input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #FBFFB8;
  cursor: pointer;
}

.ctrl .val {
  font-size: 18px;
  color: rgba(251,255,184,0.8);
}

canvas { display: block; margin-bottom: 20px; }

.phase-label {
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: #FBFFB8;
  min-height: 30px;
  text-align: center;
  opacity: 0.9;
  margin-bottom: 36px;
}

.playbtn {
  padding: 12px 52px;
  border: 0.5px solid rgba(251,255,184,0.4);
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
  font-size: 11px;
  font-family: 'Fraunces', serif;
  color: rgba(251,255,184,0.8);
  letter-spacing: 4px;
  text-transform: uppercase;
  transition: opacity 0.4s, background 0.2s;
  opacity: 1;
  display: block;
}

.playbtn.active { opacity: 0.3; }
.playbtn:hover { opacity: 1 !important; background: rgba(251,255,184,0.08); }

@media (max-width: 520px) {
  body {
    padding: 32px 16px 40px;
    justify-content: center;
    min-height: 100svh;
  }

  h1 {
    margin-bottom: 28px;
  }

  /* Stack mode cards vertically in a compact row */
  .mode-select {
    gap: 8px;
    margin-bottom: 28px;
    width: 100%;
    justify-content: center;
  }

  .mode-card {
    width: auto;
    flex: 1;
    max-width: 110px;
    padding: 14px 10px 12px;
    border-radius: 10px;
  }

  .mode-card svg {
    margin-bottom: 8px;
  }

  .mc-name {
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .mc-desc {
    font-size: 10px;
  }

  /* Sliders: full-width tracks, bigger thumb */
  .collapsible {
    max-height: 160px;
    width: 100%;
  }

  .sliders {
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl input[type=range] {
    width: 72px;
    height: 2px;
  }

  .ctrl input[type=range]::-webkit-slider-thumb {
    width: 20px;
    height: 20px;
  }

  .ctrl .val {
    font-size: 16px;
  }

  /* Canvas fills the screen width */
  canvas {
    width: 100% !important;
    height: auto !important;
    margin-bottom: 16px;
  }

  .phase-label {
    font-size: 18px;
    letter-spacing: 5px;
    margin-bottom: 28px;
  }

  /* Bigger tap target for play button */
  .playbtn {
    width: 100%;
    max-width: 320px;
    padding: 16px 0;
    font-size: 12px;
  }
}
</style>
</head>
<body>

<h1>Breathe</h1>

<div class="mode-select" id="modeSelect">
  <div class="mode-card active" onclick="setMode('line',this)">
    <svg width="70" height="32" viewBox="0 0 70 32">
      <line x1="6" y1="16" x2="64" y2="16" stroke="rgba(251,255,184,0.3)" stroke-width="0.75"/>
      <circle cx="6" cy="16" r="3" fill="rgba(251,255,184,0.2)"/>
      <circle cx="64" cy="16" r="3" fill="rgba(251,255,184,0.2)"/>
      <circle cx="18" cy="16" r="8" fill="rgba(200,202,137,0.9)"/>
    </svg>
    <div class="mc-name">Two phase</div>
    <div class="mc-desc">Inhale · exhale</div>
  </div>
  <div class="mode-card" onclick="setMode('triangle',this)">
    <svg width="70" height="50" viewBox="0 0 70 50">
      <polygon points="35,6 5,46 65,46" fill="none" stroke="rgba(251,255,184,0.3)" stroke-width="0.75"/>
      <circle cx="35" cy="6" r="8" fill="rgba(175,169,236,0.9)"/>
    </svg>
    <div class="mc-name">Three phase</div>
    <div class="mc-desc">Inhale · hold · exhale</div>
  </div>
  <div class="mode-card" onclick="setMode('square',this)">
    <svg width="70" height="50" viewBox="0 0 70 50">
      <rect x="12" y="10" width="36" height="36" fill="none" stroke="rgba(251,255,184,0.3)" stroke-width="0.75"/>
      <circle cx="12" cy="10" r="8" fill="rgba(240,153,123,0.9)"/>
    </svg>
    <div class="mc-name">Four phase</div>
    <div class="mc-desc">Inhale · hold · exhale · hold</div>
  </div>
</div>

<div class="collapsible" id="sliderWrap">
  <div class="sliders" id="sliders"></div>
</div>

<canvas id="c" width="400" height="200"></canvas>

<div class="phase-label" id="phaseLabel"></div>

<button class="playbtn" id="playbtn" onclick="togglePlay()">Start</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.body;
const phaseLabel = document.getElementById('phaseLabel');
const playbtn = document.getElementById('playbtn');
const sliderWrap = document.getElementById('sliderWrap');
const modeSelect = document.getElementById('modeSelect');

let mode = 'line', playing = false, animId = null, startTime = null;
const times = { inhale: 4, hold: 4, exhale: 4, hold2: 4 };
const modePhases = {
  line: ['inhale','exhale'],
  triangle: ['inhale','hold','exhale'],
  square: ['inhale','hold','exhale','hold2']
};
const dotC = { line:'rgba(200,202,137,1)', triangle:'rgba(175,169,236,1)', square:'rgba(240,153,123,1)' };
const bgC = { inhale:'#3a5a20', hold:'#2a2060', exhale:'#2a4a1a', hold2:'#5a3a10' };
const names = { inhale:'inhale', hold:'hold', exhale:'exhale', hold2:'hold' };
const defs = [
  {key:'inhale',label:'Inhale'},
  {key:'hold',label:'Hold'},
  {key:'exhale',label:'Exhale'},
  {key:'hold2',label:'Hold'}
];

function total() { return modePhases[mode].reduce((s,p) => s + times[p], 0); }
function getPhase(t) {
  let a = 0;
  for (const p of modePhases[mode]) {
    if (t < a + times[p]) return { phase: p, local: (t - a) / times[p] };
    a += times[p];
  }
  return { phase: modePhases[mode].slice(-1)[0], local: 1 };
}
function lerp(a, b, t) { return a + (b - a) * t; }
function pt(a, b, t) { return { x: lerp(a.x,b.x,t), y: lerp(a.y,b.y,t) }; }

function draw(prog) {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const lc = 'rgba(251,255,184,0.25)';
  ctx.strokeStyle = lc; ctx.lineWidth = 0.75;
  const t = prog * total();
  const { phase, local } = getPhase(t);
  let dot;

  if (mode === 'line') {
    const pad = 40, cy = H / 2;
    ctx.beginPath(); ctx.moveTo(pad, cy); ctx.lineTo(W-pad, cy); ctx.stroke();
    [pad, W-pad].forEach(x => { ctx.beginPath(); ctx.arc(x,cy,4,0,Math.PI*2); ctx.fillStyle=lc; ctx.fill(); });
    dot = phase === 'inhale' ? pt({x:pad,y:cy},{x:W-pad,y:cy},local) : pt({x:W-pad,y:cy},{x:pad,y:cy},local);

  } else if (mode === 'triangle') {
    const top={x:W/2,y:24}, bl={x:40,y:H-36}, br={x:W-40,y:H-36};
    ctx.beginPath(); ctx.moveTo(bl.x,bl.y); ctx.lineTo(top.x,top.y); ctx.lineTo(br.x,br.y); ctx.lineTo(bl.x,bl.y); ctx.stroke();
    dot = phase==='inhale' ? pt(bl,top,local) : phase==='hold' ? pt(top,br,local) : pt(br,bl,local);

  } else {
    const s=130, cx=W/2, cy=H/2;
    const tl={x:cx-s/2,y:cy-s/2}, tr={x:cx+s/2,y:cy-s/2}, br={x:cx+s/2,y:cy+s/2}, bl={x:cx-s/2,y:cy+s/2};
    ctx.beginPath(); ctx.moveTo(bl.x,bl.y); ctx.lineTo(tl.x,tl.y); ctx.lineTo(tr.x,tr.y); ctx.lineTo(br.x,br.y); ctx.lineTo(bl.x,bl.y); ctx.stroke();
    dot = phase==='inhale' ? pt(bl,tl,local) : phase==='hold' ? pt(tl,tr,local) : phase==='exhale' ? pt(tr,br,local) : pt(br,bl,local);
  }

  ctx.beginPath(); ctx.arc(dot.x, dot.y, 12, 0, Math.PI*2);
  ctx.fillStyle = dotC[mode]; ctx.fill();
}

function frame(ts) {
  if (!startTime) startTime = ts;
  const prog = (ts - startTime) % (total() * 1000) / (total() * 1000);
  const { phase } = getPhase(prog * total());
  phaseLabel.textContent = names[phase];
  document.body.style.background = bgC[phase];
  draw(prog);
  if (playing) animId = requestAnimationFrame(frame);
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    sliderWrap.classList.add('hidden');
    modeSelect.classList.add('hidden');
    playbtn.textContent = 'Stop';
    playbtn.classList.add('active');
    startTime = null;
    animId = requestAnimationFrame(frame);
  } else {
    cancelAnimationFrame(animId);
    sliderWrap.classList.remove('hidden');
    modeSelect.classList.remove('hidden');
    playbtn.textContent = 'Start';
    playbtn.classList.remove('active');
    document.body.style.background = '#5F6A30';
    phaseLabel.textContent = '';
    draw(0);
  }
}

function setMode(m, el) {
  mode = m;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderSliders(); draw(0);
}

function renderSliders() {
  const p = modePhases[mode];
  document.getElementById('sliders').innerHTML = defs
    .filter(d => p.includes(d.key))
    .map(d => `
      <div class="ctrl">
        <label>${d.label}</label>
        <input type="range" min="1" max="16" step="1" value="${times[d.key]}"
          oninput="times['${d.key}']=+this.value;this.nextElementSibling.textContent=this.value+'s'">
        <span class="val">${times[d.key]}s</span>
      </div>`).join('');
}

function resizeCanvas() {
  if (window.innerWidth <= 520) {
    const w = Math.min(window.innerWidth - 32, 400);
    const ratio = w / 400;
    canvas.width = w;
    canvas.height = Math.round(200 * ratio);
  } else {
    canvas.width = 400;
    canvas.height = 200;
  }
  draw(0);
}

window.addEventListener('resize', resizeCanvas);
renderSliders();
resizeCanvas();
</script>
</body>
</html>
